- hosts: dev
  connection: ssh
  tasks: 
    - name: installing httpd
      yum: 
        name: httpd
        state: present
    - name: starting httpd
      service:
        name: httpd
        state: started
    - name: create an index.html file
      file: 
        path: /var/www/html/index.html 
        state: touch
    - name: copy the content to index.html from a string
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1> Hi Venkatesh, this is your index file </h1>
          <h2> Hope you like it! </h2>
